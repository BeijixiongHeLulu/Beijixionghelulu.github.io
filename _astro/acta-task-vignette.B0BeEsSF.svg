<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="figure-title">
<title id="figure-title">Predict, observe and report a coin outcome</title>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#536678" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<rect id="figure-surface" width="640" height="400" fill="#fcfdfd"/>

<text x="36" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#21394b" text-anchor="start">A task for studying honesty</text>
<g id="card-task-1">
<rect x="28" y="102" width="172" height="236" rx="14" fill="#f3f7f9" stroke="#c9d5de" stroke-width="1.5"/>
<text x="114" y="151" font-family="Arial" font-size="31" font-weight="700" fill="#21394b" text-anchor="middle">Predict</text>
<circle cx="76" cy="229" r="30" fill="white" stroke="#285d7e" stroke-width="2"/>
<text x="76" y="242" font-family="Arial" font-size="36" font-weight="700" fill="#285d7e" text-anchor="middle">H</text>
<circle cx="152" cy="229" r="30" fill="white" stroke="#285d7e" stroke-width="2"/>
<text x="152" y="242" font-family="Arial" font-size="36" font-weight="700" fill="#285d7e" text-anchor="middle">T</text>
</g>
<path d="M 206 221 H 227" fill="none" stroke="#536678" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="card-task-2">
<rect x="234" y="102" width="172" height="236" rx="14" fill="#f3f7f9" stroke="#c9d5de" stroke-width="1.5"/>
<text x="320" y="151" font-family="Arial" font-size="31" font-weight="700" fill="#21394b" text-anchor="middle">Observe</text>
<circle cx="320" cy="229" r="42" fill="white" stroke="#285d7e" stroke-width="2"/>
<text x="320" y="245" font-family="Arial" font-size="46" font-weight="700" fill="#285d7e" text-anchor="middle">T</text>
</g>
<path d="M 412 221 H 433" fill="none" stroke="#536678" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="card-task-3">
<rect x="440" y="102" width="172" height="236" rx="14" fill="#f3f7f9" stroke="#c9d5de" stroke-width="1.5"/>
<text x="526" y="151" font-family="Arial" font-size="31" font-weight="700" fill="#21394b" text-anchor="middle">Report</text>
<text x="526" y="220" font-family="Arial" font-size="30" font-weight="700" fill="#285d7e" text-anchor="middle">Correct?</text>
<text x="526" y="266" font-family="Arial" font-size="29" font-weight="400" fill="#536678" text-anchor="middle">Yes / No</text>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Behavioral and EEG inputs to decision modeling</title>
  <desc id="desc">Response times and choices provide fitting observations. CPP slope enters the drift-rate specification. Candidate decision models are fitted and compared.</desc>
  <rect id="background" width="640" height="400" fill="#f4f6f8"/>
  <g id="input-connections" fill="none" stroke="#557a99" stroke-width="3">
    <path d="M166 154V190H320V234"/>
    <path d="M474 154V190H320"/>
    <path d="m312 224 8 10 8-10"/>
  </g>
  <g id="behavioral-input">
    <rect x="40" y="44" width="252" height="110" rx="15" fill="#fff" stroke="#c8d3de" stroke-width="2"/>
    <text x="166" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#25374b">Responses</text>
    <text x="166" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#53677a">Time + choice</text>
  </g>
  <g id="neural-covariate">
    <rect x="348" y="44" width="252" height="110" rx="15" fill="#fff" stroke="#c8d3de" stroke-width="2"/>
    <text x="474" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#25374b">CPP slope</text>
    <text x="474" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#53677a">Drift specification</text>
  </g>
  <g id="model-comparison">
    <rect x="153" y="244" width="334" height="112" rx="15" fill="#e6eef5" stroke="#8fa9bf" stroke-width="2"/>
    <text x="320" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#25374b">Decision models</text>
    <text x="320" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#53677a">Fit + complexity</text>
  </g>
</svg>

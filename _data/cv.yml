        end_date: null
        summary: "Supervisor: Dr. Ze Geng. EEG analysis and behavioral modeling."
        highlights:
          - Preprocess EEG recordings and extract single-trial centroparietal positivity (CPP) slopes to characterize neural evidence accumulation.
          - Fit drift diffusion models to IAT response times and accuracy using PyDDM, comparing model specifications with BIC.
          - Integrate trial-level neural measures with behavioral decision models; completed all data analyses for a manuscript submitted to the Journal
            of Environmental Psychology.
      - company: Institute of Software, Chinese Academy of Sciences (ISCAS)
        position: Research Intern
        location: Beijing, China
        start_date: 2025-07
        end_date: null
        summary: "Supervisors: Dr. Chao Zhou and Prof. Jin Huang. Human performance during whole-body motion."
        highlights:
          - Developed Unity-based directional-judgment experiments on a 6-DOF motion platform.
          - Analyzed response times in relation to task-relative motion components and individual differences; contributed to a manuscript submitted
            to CHI 2027.
      - company: Human Factors in Driving Takeover
        position: Independent Research Project
        location: null
        start_date: 2025-12
        end_date: null
        summary: "Supervisor: Prof. Yanan Chen."
        highlights:
          - Independently developed a Unity-based VR driving scenario using PICO 4 Pro, integrating eye tracking with ECG, GSR, and EMG recording.
          - Designed a two-stage warning experiment examining cognitive load and the monitoring-to-takeover request interval in situation-awareness
            recovery and takeover performance.
          - Analyzed behavioral and physiological data alongside individual differences in personality and driving style.
      - company: Shenzhen University
        position: Research Intern
        location: Shenzhen, China
        start_date: 2024-10
        end_date: 2025-07
        summary: "Supervisor: Prof. Zhenhong He. Loss and compensation in decision-making."
        highlights:
          - Designed experiments and programmed behavioral tasks in PsychoPy for research on loss and compensatory decisions.
          - Developed Python data-analysis pipelines and applied drift diffusion and reinforcement-learning models to behavioral data.
      - company: Human-AI Ethics
        position: Independent Research Project
        location: null
        start_date: 2024-09
        end_date: 2025-12
        summary: "Supervisor: Prof. Yanan Chen."
        highlights:
          - Designed and programmed PsychoPy experiments examining how AI supervision and incentives influence dishonest behavior and ethical decision-making.
          - Analyzed behavioral data in Python/R using mixed-effects models; the resulting article was published in Acta Psychologica Sinica.

    Projects:
      - name: Human Factors in Driving Takeover
        start_date: 2025-12
        end_date:
        summary: "Independent Researcher. Supervisor: Prof. Yanan Chen."
        highlights:
          - Developed a Unity-based VR driving scenario using PICO 4 Pro for scene presentation and eye-tracking data collection, with simultaneous ECG, GSR, and EMG recording.
          - Designed a two-stage warning experiment to test how the interval between monitoring request (MR) and takeover request (TOR) interacts with cognitive load to affect situation-awareness recovery and takeover performance.
          - Examined stable individual differences and state-level factors in automated driving takeover.

      - name: Human Performance in Moving Conditions
        start_date: 2025-07
        end_date:
        summary: "Independent Researcher. Supervisors: Dr. Chao Zhou and Prof. Jin Huang."
        highlights:
          - Developed experiments on a 6-DOF motion platform using Unity.
          - Examined how motion intensity and directional congruency affect human performance.

      - name: Human-Autonomous Interaction
        start_date: 2025-03
        end_date:
        summary: "Independent Researcher. Supervisor: Prof. Yanan Chen."
        highlights:
          - Developed a simulated VR takeover scenario in Unity.
          - Modeled drivers' situation awareness using multimodal measures, including ERP, ECG, and GSR.

      - name: Human-AI Ethics
        start_date: 2024-09
        end_date: 2025-12
        summary: "Independent Researcher. Supervisor: Prof. Yanan Chen."
        highlights:
          - Investigated how AI supervision and incentive mechanisms influence dishonest behavior and ethical decision-making.
          - Applied mixed-effects models to behavioral data.


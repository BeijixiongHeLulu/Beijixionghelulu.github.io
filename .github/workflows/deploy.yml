name: Deploy site
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: academic-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, content, links and build
        run: |
          pnpm format:check
          pnpm verify
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check desktop and mobile interactions
        run: pnpm test:browser
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: site/test-results/
      - name: Deploy to the existing GitHub Pages branch
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/dist
